<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .line-art {
        fill: none;
        stroke: #b75039;
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .text-dark {
        font-family: 'Plus Jakarta Sans', 'DM Sans', sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: #26352f;
      }
      .text-coral {
        font-family: 'Plus Jakarta Sans', 'DM Sans', sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: #b75039;
      }
      .sub-text {
        font-family: 'DM Sans', sans-serif;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 6px;
        fill: #68746d;
      }
    </style>
  </defs>

  <!-- Arka Plan (Şeffaf veya Beyaz kullanılabilir) -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- İKON GRUBU: Büyüteç ve Mezuniyet Şapkası İkisi Bir Arada Halkada -->
  <g transform="translate(40, -10)">
    <!-- Sol Taraf: Büyüteç (Search/Kayıp Eşya Sembolü) -->
    <path class="line-art" d="M 180 230 C 140 230, 110 200, 110 160 C 110 120, 140 90, 180 90 C 220 90, 250 120, 250 160 C 250 178, 243 194, 232 206 L 195 260 C 190 267, 180 267, 175 260 Z" />
    <circle class="line-art" cx="180" cy="160" r="28" stroke-width="10" />

    <!-- Sağ Taraf: Kampüs Şapkası (Öğrenci/Kampüs Sembolü) -->
    <!-- Bağlantı Halkası -->
    <path class="line-art" d="M 235 125 C 265 110, 295 130, 290 165" stroke-dasharray="2 0" />
    <!-- Kep Çatısı -->
    <polygon class="line-art" points="310,140 370,165 310,190 250,165" />
    <!-- Kep Alt Tabana Oturma Alanı -->
    <path class="line-art" d="M 275 176 L 275 205 C 275 215, 345 215, 345 205 L 345 176" />
    <!-- Kep Püskülü -->
    <path class="line-art" d="M 370 165 L 385 195 L 385 210" stroke-width="8" />
  </g>

  <!-- METİN GRUBU (Logo Alt Yazısı) -->
  <g text-anchor="middle">
    <!-- "kampüstebul" Başlığı -->
    <text x="250" y="360">
      <tspan class="text-dark">kampüste</tspan><tspan class="text-coral">bul.</tspan>
    </text>
    
    <!-- Alt Slogan / Açıklama -->
    <text x="254" y="405" class="sub-text">KAMPÜS KAYIP EŞYA AĞI</text>
  </g>
</svg>